# Deckora — un solo Web Service en Render (frontend + backend)
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: deckora
    runtime: node
    plan: free
    region: frankfurt
    # NODE_ENV=production hace que pnpm omita devDependencies (vite, typescript…)
    # Por eso forzamos install completo en el build.
    buildCommand: npm install -g pnpm@9 && pnpm install --prod=false && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
    healthCheckPath: /health
