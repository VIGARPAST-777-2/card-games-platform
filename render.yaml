# Deckora — un solo Web Service en Render (frontend + backend)
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: deckora
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install -g pnpm@9 && pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
    healthCheckPath: /health
