# Deckora — un solo Web Service en Render

services:
  - type: web
    name: deckora
    runtime: node
    plan: free
    region: frankfurt
    # --prod=false: instala devDependencies (vite, typescript) aunque haya NODE_ENV=production
    buildCommand: npm install -g pnpm@9 && pnpm install --prod=false && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_VERSION
        value: "22"
    healthCheckPath: /health
