name: Supabase Migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch:  # permitir lanzar a mano desde Actions

jobs:
  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest
    # No falla el repo si aún no has puesto los secrets
    # (el job hace fail solo cuando sí hay secrets y el push falla)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets
        id: check
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] || [ -z "${{ secrets.SUPABASE_PROJECT_ID }}" ] || [ -z "${{ secrets.SUPABASE_DB_PASSWORD }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Faltan secrets de Supabase. Configura SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_ID y SUPABASE_DB_PASSWORD."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Supabase CLI
        if: steps.check.outputs.configured == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project & push migrations
        if: steps.check.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push --include-all

      - name: Skip notice
        if: steps.check.outputs.configured != 'true'
        run: echo "Migraciones no aplicadas (secrets no configurados)."
